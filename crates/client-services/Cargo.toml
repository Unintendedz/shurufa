[package]
name = "msime-client-services"
description = "Client side of local user services and content: diagnostics, skins, plugins, dictionaries, and typing statistics."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
msime-client-base = { path = "../client-base" }
msime-client-core = { path = "../client-core" }
msime-path-trust = { path = "../path-trust" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tempfile.workspace = true
unicode-general-category.workspace = true
unicode-segmentation.workspace = true
sha2.workspace = true
# 插件编辑器自动生成包标识使用的系统随机数（`plugins::authoring`）。
getrandom = "0.4"
hex = "0.4"
base64 = "0.23"
uuid = { workspace = true, features = ["serde", "v4"] }
# `formatting` 用于指令表插件的 strftime 占位符校验，`diagnostics` 也用 `time::OffsetDateTime` 格式化时间。
time = { workspace = true, features = ["formatting", "parsing"] }
# 支持从本地 .zip 压缩包导入插件包并写入诊断归档。
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
# 皮肤包资源解码与动图帧校验。
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
zune-jpeg = "0.5.15"
png = "0.18.1"

[dev-dependencies]
msime-client-base = { path = "../client-base", features = ["test-support"] }
msime-path-trust = { path = "../path-trust", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[lints]
workspace = true
