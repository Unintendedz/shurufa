[package]
name = "msime-engine"
description = "Pure Rust input engine: composition state, pinyin/shuangpin schemes, dictionaries and learning."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
msime-path-trust = { path = "../path-trust" }
chinese-number = { version = "0.8", default-features = false, features = ["std", "number-to-chinese"] }
exmex = "0.21"
hex = "0.4"
libc.workspace = true
lru = "0.18"
lunar-lite = "0.1"
memmap2 = "0.9"
# V 模式单位换算。MPL-2.0，原样使用（见 resources/licenses/MPL-2.0.txt）。`bundle-files` 内嵌 definitions.units，不加载需要网络的实时汇率。
rink-core = { version = "0.9.0", default-features = false, features = ["bundle-files"] }
rusqlite = { workspace = true, features = ["bundled", "backup"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "local-offset"] }
unicode-segmentation.workspace = true

[lints]
workspace = true
