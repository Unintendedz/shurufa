[workspace]
members = [
    "crates/path-trust",
    "crates/client-base",
    "crates/client-core",
    "crates/client-providers",
    "crates/client-services",
    "crates/engine",
    "crates/input-runtime",
    "crates/host-api",
]
default-members = [
    "crates/path-trust",
    "crates/client-base",
    "crates/client-core",
    "crates/client-providers",
    "crates/client-services",
    "crates/engine",
    "crates/input-runtime",
    "crates/host-api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"
repository = "https://github.com/Unintendedz/shurufa"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1.14"
toml = "1.1"
thiserror = "2"
tempfile = "3"
unicode-general-category = "1.1"
unicode-segmentation = "1.13"
sha2 = "0.11"
rusqlite = "0.40"
time = "0.3"
tokio = "1"
rustix = "1.1"
libc = "0.2"
uuid = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.kira]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-format-riff]
opt-level = 3

[profile.dev.package.symphonia-format-ogg]
opt-level = 3

[profile.dev.package.symphonia-codec-pcm]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
